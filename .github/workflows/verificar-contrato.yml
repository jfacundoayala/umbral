name: Verificar contrato

# Recompila el contrato desde el código fuente publicado, dentro de la imagen
# fijada, y compara byte a byte con lo que está en la red (SEP-58).
on:
  workflow_dispatch:
    inputs:
      contrato:
        description: "Id del contrato (C...) en la red de pruebas"
        required: false
      wasm_hash:
        description: "O el hash del wasm ya subido a la red"
        required: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: stellar/stellar-cli@v30.0.1
      - name: Instalar el plugin de verificación
        run: cargo install --locked --git https://github.com/stellar-experimental/stellar-contract-verify-plugin
      - name: Verificar
        shell: bash
        run: |
          # La imagen compila con el usuario 1000 y el plugin arma una carpeta privada:
          # se corre el plugin con un usuario de ese mismo número para que el contenedor pueda leerla.
          sudo cp "$(command -v stellar)" "$(command -v stellar-contract-verify)" /usr/local/bin/
          id -u 1000 >/dev/null 2>&1 || sudo useradd --uid 1000 --create-home verificador
          USUARIO="$(id -nu 1000)"
          sudo usermod -aG docker "$USUARIO"
          if [ -n "${{ inputs.contrato }}" ]; then ARG="--id ${{ inputs.contrato }}"; else ARG="--wasm-hash ${{ inputs.wasm_hash }}"; fi
          sudo -u "$USUARIO" -H sg docker -c "cd ~ && stellar contract verify $ARG --network testnet --trust --verbose" 2>&1 | tee salida.txt
          grep -E "Verified|Source SHA-256|Build image" salida.txt >> "$GITHUB_STEP_SUMMARY"
          grep -q "Verified" salida.txt
